# Streamlit settings for LedgerLens.
# They keep the first start calm: no e-mail question, no usage reporting,
# and no file-watcher noise from the machine-learning libraries.

[server]
# Watching the source files makes torch/transformers print confusing messages. We do not need it.
fileWatcherType = "none"
# Streamlit itself rejects uploads bigger than this many megabytes.
maxUploadSize = 25
# Do not ask first-time users for an e-mail address.
showEmailPrompt = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
